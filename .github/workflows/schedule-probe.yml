name: Schedule probe

# 임시 진단용: 새 리포에서 GitHub schedule/push 이벤트가 실행되는지 확인한다.
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "event=${{ github.event_name }} cron=${{ github.event.schedule }} now=$(date -u +%FT%TZ)"
